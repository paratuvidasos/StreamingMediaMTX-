###############################################
# HLS (salida para espectadores)
###############################################
hls: yes
hlsAddress: :8888
hlsVariant: fmp4
hlsAlwaysRemux: yes
hlsSegmentDuration: 2s

###############################################
# WebRTC / WHIP (ingesta desde navegador)
###############################################
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [publish.sosparatuvida.com.co]
webrtcIPsFromInterfaces: no
webrtcAllowOrigin: "https://universidad.sosparatuvida.com.co"

###############################################
# API de control (NUEVO - activar/desactivar grabación en caliente)
###############################################
api: yes
apiAddress: :9997

###############################################
# Autenticación (webhook en business-service-api)
###############################################
authMethod: http
authHTTPAddress: http://sos-business-api-6vdzd8:3000/api/v1/streams/auth
authHTTPExclude:
  - action: read # espectadores ven sin credenciales (fase 1)
  - action: playback

###############################################
# Paths
###############################################
paths:
  ~^.*$:
    source: publisher
    record: no # arranca apagado, se activa por API cuando el profesor da "Grabar"
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordSegmentDuration: 4h
    runOnRecordSegmentComplete: >
      curl -X POST http://sos-business-api-6vdzd8:3000/api/v1/streams/recording-ready
      -H "Content-Type: application/json"
      -d '{"path":"%path","file":"%MTX_SEGMENT_PATH"}'
